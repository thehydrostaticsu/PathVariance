[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pathvariance"
version = "1.0.2"
description = "Measure whether an agent solves the same task the same way twice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PathVariance contributors" }]
keywords = ["agent", "evaluation", "tool-path", "entropy", "reproducibility"]

[project.scripts]
pathvariance = "pathvariance.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
