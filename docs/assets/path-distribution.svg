<!--
  pathvariance path distribution, small multiples. One compact lane per
  distinct path, all sharing one step index axis across the top, so the reader
  can see exactly where the lanes stop agreeing. The modal path (lane A) is
  emphasised with a filled teal track; the two minority lanes are grey. A short
  amber callout marks the first divergence, step index 2.

  Every number here comes from a real run of this project against
  samples/task-repeat.json:
    runs 12, distinct paths 3, modal share 66.7 percent (8 of 12),
    lane B 2 of 12, lane C 2 of 12, Shannon entropy 1.252 bits,
    normalised entropy 0.790, first divergence index 2.
  Captured with: PYTHONPATH=src python -m pathvariance report samples/task-repeat.json

