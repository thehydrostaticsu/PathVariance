<?xml version="1.0" encoding="UTF-8"?>
<!--
  pathvariance path distribution, small multiples. One compact lane per
  distinct path, all sharing one step index axis across the top, so the reader
  can see exactly where the lanes stop agreeing. The modal path (lane A) is
  emphasised with a filled teal track; the two minority lanes are grey. A short
  amber callout marks the first divergence, step index 2.

  Every number here comes from a real run of this project against
  samples/task-repeat.json:
    runs 12, distinct paths 3, modal share 66.7 percent (8 of 12),
    lane B 2 of 12, lane C 2 of 12, Shannon entropy 1.252 bits,
    normalised entropy 0.790, first divergence index 2.
  Captured with: PYTHONPATH=src python -m pathvariance report samples/task-repeat.json

  Palette, two cores plus one accent, from the subject:
    ink   #1b2a33  labels and tokens, 14.7:1 on the panel fill
    teal  #0f6b6b  the modal path most runs share, 5.6:1 on the panel fill
    amber #b5651d  the accent, the first divergence, one place only, 18px+
  Neutrals: page #ffffff, panel #f4f1ec, grid rule #d7d0c4, minority #5a6b73.
  Stroke roles, one width each: lane track 10 (via rect height), axis rule 1,
  callout leader 1.5. One corner radius: 3, reused on every cell and chip.
  All edges on an 8 unit grid. Cells step by 104 on x from x=176.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="distTitle distDesc">
  <title id="distTitle">Path distribution across 12 repeated runs of one task</title>
  <desc id="distDesc">Three lanes share one step axis. Lane A, the modal path taken by 8 of 12 runs, runs grep read edit test done. Lanes B and C, each 2 of 12 runs, agree on the first two steps then diverge at step index 2. Shannon entropy is 1.252 bits.</desc>

  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <!-- Title block -->
  <text x="32" y="44" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b2a33">Path distribution, 12 runs</text>
  <text x="32" y="68" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#5a6b73">task: fix-null-deref-in-parser</text>

  <!-- Summary chips, right aligned group. Each on its own baseline pair. -->
  <text x="688" y="40" text-anchor="end" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="13" fill="#5a6b73">distinct paths</text>
  <text x="688" y="60" text-anchor="end" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="22" font-weight="700" fill="#1b2a33">3</text>
  <text x="560" y="40" text-anchor="end" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="13" fill="#5a6b73">entropy (bits)</text>
  <text x="560" y="60" text-anchor="end" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="22" font-weight="700" fill="#1b2a33">1.252</text>

  <!-- Panel behind the lanes -->
  <rect x="32" y="96" width="656" height="296" rx="3" fill="#f4f1ec"/>

  <!-- Step index axis across the top of the panel. Six steps, index 0..5. -->
