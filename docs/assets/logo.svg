<?xml version="1.0" encoding="UTF-8"?>
<!--
  pathvariance logo. Wordmark with a colour split at the morpheme boundary
  path|variance, paired with a mark that is a literal diagram of the tool's
  core data structure: three runs leaving one shared origin node, one lane
  (the modal path) emphasised, two diverging. This is what the tool measures.

  Palette, two cores plus one accent, derived from the subject:
    ink   #1b2a33  steady text, contrast 14.7:1 on white
    teal  #0f6b6b  the modal path that most runs share, 6.3:1 on white
    amber #b5651d  the accent, a divergence, 4.34:1 on white so used only at
                   18px and above where WCAG asks 3:1
  Neutrals: white background, grey #5a6b73 for the diverging lanes, 5.55:1.
  One stroke width per role: lanes 3, origin ring 2. One corner radius: none
  needed, geometry is circles and straight lanes on a 4 unit grid.
  Coordinates sit on a 4 unit grid within a 240 x 96 viewBox.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" width="240" height="96" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">pathvariance</title>
  <desc id="logoDesc">Three runs leave one origin node; one modal lane in teal stays straight while two grey lanes diverge, beside the wordmark path in ink and variance in teal.</desc>
  <rect x="0" y="0" width="240" height="96" fill="#ffffff"/>

  <!-- Mark: origin node with three lanes. Origin at (28,48) on the grid. -->
  <g fill="none">
    <!-- Diverging lane up, grey -->
    <path d="M28 48 L52 48 L72 28" stroke="#5a6b73" stroke-width="3"/>
